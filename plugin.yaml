manifest_version: 2
name: solverforge-routing
version: 0.2.2
label: SolverForge Routing
description: Personal single-vehicle driving itineraries from searched places, batch plans, shared pins or coordinates. Explicit searches send query and region to Nominatim; solving routes on OpenStreetMap roads locally with solverforge-maps (the first solve in a new area downloads that area from Overpass); best-found estimates with honest savings, repair diffs and Google/Apple/OSM handoff links (opening one sends stops to that provider). Not live traffic.
author: blackopsrepl
license: Apache-2.0
requires_hermes: ">=0.22.2"
provides_tools:
  - route_search_locations
  - route_confirm_location
  - route_plan_places
  - route_confirm_plan
  - route_status
  - route_current
  - route_set_origin
  - route_set_end
  - route_set_round_trip
  - route_add_stop
  - route_remove_stop
  - route_mark_visited
  - route_set_next
  - route_precedence
  - route_solve
provides_hooks: []
capabilities: []
config_schema:
  geocoder_url:
    type: str
    default: "https://nominatim.openstreetmap.org/search"
    label: Nominatim-compatible HTTPS search URL
    description: Public development default, no availability guarantee. Explicit searches disclose query and region. No credentials; switch provider here. No autocomplete; user-wide pacing and profile cache apply.
  binary:
    type: str
    default: ""
    label: Routing engine executable path
    description: Plain path, not a shell command. Empty uses an existing local development build or plugin-data/bin/solverforge-routing. No automatic download.
