<!doctype html><html lang="en"><head><meta charset="utf-8"><title>SolverForge Routing architecture</title><style>
html,body{margin:0;width:1200px;height:760px;overflow:hidden}body{background:#04140c;color:#ecfdf5;font-family:"Fira Sans",sans-serif}.head{position:absolute;left:42px;top:30px}.head span{color:#4ade80;font:14px "Fira Code",monospace;letter-spacing:2px}.head h1{font-size:32px;margin:12px 0}.head p{color:#bbf7d0;margin:0;font-size:17px}svg{position:absolute;top:140px;left:40px}text{font-family:"Fira Sans",sans-serif}.name{font-size:20px;fill:#ecfdf5;font-weight:600}.sub{font-size:15px;fill:#bbf7d0}.label{font-size:14px;fill:#86efac}.small{font-size:13px;fill:#a7bdb1}.box{fill:#0b261a;stroke:#34d399;stroke-width:1.5}.external{fill:#13211b;stroke:#718c7c;stroke-width:1.5}.arrow{stroke:#34d399;stroke-width:2;fill:none;marker-end:url(#arrow)}.net{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5;fill:none;marker-end:url(#extarrow)}
</style></head><body><header class="head"><span>HERMES × SOLVERFORGE</span><h1>Your stops become a road itinerary.</h1><p>One local road graph supplies both the travel times and the roads you see.</p></header>
<svg width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-label="Hermes sends stops to the Python plugin, which calls the Rust engine. SolverForge Maps loads roads from Overpass; SolverForge orders stops. The map displays the returned road legs through SolverForge UI.">
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#34d399"/></marker><marker id="extarrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#94a3b8"/></marker></defs>
<rect x="10" y="10" width="1100" height="450" rx="14" fill="#061b11" stroke="#214333"/>
<text x="28" y="40" class="label">YOUR COMPUTER</text>
<path class="arrow" d="M240 127H315"/><text x="261" y="110" class="label">stops</text>
<path class="arrow" d="M580 127H655"/><text x="600" y="110" class="label">JSON</text>
<path class="arrow" d="M787 265V330H580"/><text x="635" y="312" class="label">order + road legs</text>
<path class="arrow" d="M315 330H240"/>
<path class="arrow" d="M447 195V265"/>
<rect class="box" x="38" y="78" width="202" height="116" rx="8"/><text x="58" y="112" class="name">Hermes chat</text><text x="58" y="142" class="sub">Places and edits</text><text x="58" y="168" class="sub">Your choice of matches</text>
<rect class="box" x="315" y="78" width="265" height="116" rx="8"/><text x="336" y="112" class="name">Python plugin</text><text x="336" y="142" class="sub">Stops, history and locks</text><text x="336" y="168" class="sub">Revision-checked updates</text>
<rect class="box" x="655" y="78" width="400" height="187" rx="8"/><text x="678" y="112" class="name">One Rust engine</text><text x="678" y="147" class="sub">solverforge-maps → road graph + matrix</text><text x="678" y="178" class="sub">SolverForge → visiting order</text><text x="678" y="209" class="sub">Same graph → one road line per hop</text><text x="678" y="239" class="small">No separate routing server</text>
<rect class="box" x="315" y="265" width="265" height="130" rx="8"/><text x="336" y="303" class="name">Profile storage</text><text x="336" y="335" class="sub">SQLite route state</text><text x="336" y="365" class="sub">Cached road network</text>
<rect class="box" x="38" y="273" width="202" height="122" rx="8"/><text x="58" y="308" class="name">Map beside chat</text><text x="58" y="340" class="sub">solverforge-ui + Leaflet</text><text x="58" y="369" class="sub">Roads and itinerary</text>
<path class="net" d="M855 265V495"/><text x="870" y="410" class="small">Area download on cache miss</text>
<path class="net" d="M580 173H610V475H447V495"/><text x="462" y="445" class="small">Explicit place search</text>
<path class="net" d="M139 395V495"/><text x="154" y="445" class="small">Visible map tiles</text>
<rect class="external" x="38" y="495" width="202" height="64" rx="8"/><text x="59" y="524" class="name">OSM tile servers</text><text x="59" y="547" class="small">Visible area + IP</text>
<rect class="external" x="315" y="495" width="265" height="64" rx="8"/><text x="336" y="524" class="name">Nominatim</text><text x="336" y="547" class="small">Search query + approximate area</text>
<rect class="external" x="655" y="495" width="400" height="64" rx="8"/><text x="678" y="524" class="name">OpenStreetMap via Overpass</text><text x="678" y="547" class="small">Bounding box around the route; not the stops</text>
</svg></body></html>
