[package]
name = "solverforge-routing"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
solverforge = "=0.24.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Road graph, matrix and per-hop geometry. Path until the next solverforge-maps release.
solverforge-maps = { path = "../../../dev/solverforge/solverforge-maps" }
tokio = { version = "1", features = ["rt-multi-thread"] }
