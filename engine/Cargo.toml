[package]
name = "solverforge-routing"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
solverforge = "=0.24.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Road graph, matrix and per-hop geometry.
solverforge-maps = "=2.3.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
